[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-ctx"
version = "0.2.0"
description = "Spatial tumour habitat inference from H&E histology, with context-aware prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "computational-pathology",
    "spatial-omics",
    "tumour-microenvironment",
    "whole-slide-imaging",
    "survival-analysis",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/swatian1989/canvas-ctx"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function call in argument default: intentional for config objects
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path setup must precede local imports
"tests/*" = ["E402"]
